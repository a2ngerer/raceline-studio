[project]
name = "raceline-studio"
version = "0.1.0"
description = "Interactive raceline editor for F1TENTH-style autonomous racing: live centerline, min-curvature/min-time optimization, friction-circle speed profiles, one-command upload to the car."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Angerer" }]
keywords = ["f1tenth", "raceline", "trajectory-optimization", "autonomous-racing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "pillow>=10.0",
]

[project.scripts]
raceline-studio = "raceline_studio.server:main"

[project.urls]
Homepage = "https://github.com/a2ngerer/raceline-studio"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raceline_studio"]

[tool.ruff]
line-length = 88
extend-exclude = ["raceline_studio/web"]

[tool.ruff.lint]
ignore = ["E741"]
